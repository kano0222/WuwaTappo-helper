name: Build Windows helper

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24.12.0'
          package-manager-cache: false
      - name: Test backend
        run: npm test
      - name: Test panel controls
        run: npm run test:ui
      - name: Test panel layouts
        run: pwsh -NoProfile -STA -File tests/panel-layout.ps1
      - name: Test shared status files
        run: npm run test:files
      - name: Test application discovery
        run: pwsh -NoProfile -File tests/app-discovery.ps1
      - name: Test panel lifecycle
        run: pwsh -NoProfile -STA -File tests/panel-reopen.ps1
      - name: Build distribution
        run: ./scripts/Build-Distribution.ps1
      - name: Validate packaged launcher
        run: |
          $packages = @(Get-ChildItem -LiteralPath dist -Directory)
          if ($packages.Count -ne 1) { throw 'Expected one distribution directory.' }
          ./tests/launcher-smoke.ps1 -PackageRoot $packages[0].FullName
      - name: Upload Windows package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: WuwaTappoHelper-win-x64-${{ github.run_number }}
          path: dist/*.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
