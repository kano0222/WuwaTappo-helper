name: Build Windows helper

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 15
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Build and test native C# application
        run: ./scripts/Build.ps1 -Test
      - name: Stage portable distribution
        run: |
          $stage = Join-Path $PWD 'dist/WuwaTappoHelper-win-x64'
          [void][IO.Directory]::CreateDirectory($stage)
          foreach ($file in @('build/WuwaTappoHelper.exe','build/WuwaTappoHelper.exe.config','README.md','config.example.json')) {
            Copy-Item -LiteralPath $file -Destination $stage
          }
          $check = Start-Process -FilePath (Join-Path $stage 'WuwaTappoHelper.exe') -ArgumentList '--check' -PassThru -Wait -WindowStyle Hidden
          if ($check.ExitCode -ne 0) { throw 'Embedded resource validation failed.' }
          $files = @(Get-ChildItem -LiteralPath $stage -Recurse -File)
          if ($files.Count -ne 4) { throw 'Unexpected distribution files.' }
          $size = ($files | Measure-Object Length -Sum).Sum
          if ($size -gt 5MB) { throw 'Native distribution unexpectedly exceeds 5 MiB.' }
          "Native distribution: $size bytes; no bundled PowerShell or Node.js." >> $env:GITHUB_STEP_SUMMARY
      - name: Create package in GitHub Actions
        run: |
          [IO.Compression.ZipFile]::CreateFromDirectory((Join-Path $PWD 'dist/WuwaTappoHelper-win-x64'),(Join-Path $PWD 'dist/WuwaTappoHelper-win-x64.zip'))
      - name: Upload Windows package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: WuwaTappoHelper-win-x64-${{ github.run_number }}
          path: dist/*.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
