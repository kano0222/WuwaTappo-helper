name: Build Windows helper

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 15
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Build and test native C# application
        run: ./scripts/Build.ps1 -Test
      - name: Test bridge resource discovery
        run: |
          node ./tests/discovery.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Discovery tests failed.' }
          node ./tests/boost.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Boost receipt tests failed.' }
      - name: Stage portable distribution
        run: |
          $stage = Join-Path $PWD 'dist/WuwaTappoHelper-win-x64'
          [void][IO.Directory]::CreateDirectory($stage)
          foreach ($file in @('build/WuwaTappoHelper.exe','build/WuwaTappoHelper.exe.config','README.md','config.example.json')) {
            Copy-Item -LiteralPath $file -Destination $stage
          }
          $check = Start-Process -FilePath (Join-Path $stage 'WuwaTappoHelper.exe') -ArgumentList '--check' -PassThru -Wait -WindowStyle Hidden
          if ($check.ExitCode -ne 0) { throw 'Embedded resource validation failed.' }
          $files = @(Get-ChildItem -LiteralPath $stage -Recurse -File)
          if ($files.Count -ne 4) { throw 'Unexpected distribution files.' }
          $size = ($files | Measure-Object Length -Sum).Sum
          if ($size -gt 5MB) { throw 'Native distribution unexpectedly exceeds 5 MiB.' }
          "Native distribution: $size bytes; no bundled PowerShell or Node.js." >> $env:GITHUB_STEP_SUMMARY
      - name: Create package in GitHub Actions
        run: |
          [IO.Compression.ZipFile]::CreateFromDirectory((Join-Path $PWD 'dist/WuwaTappoHelper-win-x64'),(Join-Path $PWD 'dist/WuwaTappoHelper-win-x64.zip'))
      - name: Upload Windows package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: WuwaTappoHelper-win-x64-${{ github.run_number }}
          path: dist/*.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout release changelog
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Extract version release notes
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import os
          import pathlib
          import re

          tag = os.environ['RELEASE_TAG']
          if not re.fullmatch(r'v\d+\.\d+\.\d+', tag):
              raise SystemExit('Release tag must use vX.Y.Z format.')
          text = pathlib.Path('CHANGELOG.md').read_text(encoding='utf-8')
          sections = re.split(r'^##\s+', text, flags=re.MULTILINE)[1:]
          notes = []
          for section in sections:
              heading, _, body = section.partition('\n')
              if re.fullmatch(r'\[' + re.escape(tag[1:]) + r'\] - \d{4}-\d{2}-\d{2}\s*', heading):
                  notes.append(body.strip())
          if len(notes) != 1 or not notes[0]:
              raise SystemExit('CHANGELOG.md must contain exactly one nonempty entry for ' + tag)
          pathlib.Path('release-notes.md').write_text(notes[0] + '\n', encoding='utf-8')
          PY
      - name: Download tested Windows package
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: WuwaTappoHelper-win-x64-${{ github.run_number }}
          path: release-assets
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: >-
          gh release create "$RELEASE_TAG"
          release-assets/WuwaTappoHelper-win-x64.zip
          --verify-tag --title "$RELEASE_TAG" --notes-file release-notes.md
